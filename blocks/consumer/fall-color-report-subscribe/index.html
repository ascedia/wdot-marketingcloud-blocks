<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consumer - Fall Color Report Subscribe</title>
    <link rel="stylesheet" href="../../../assets/dist/css/main.min.css" type="text/css" media="all">
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <div class="mb-3" id="sdkStatus" aria-live="polite"></div>
          <form>
            <fieldset class="border p-2">
              <legend>Content</legend>
              <div class="mb-3">
                <label for="headline" class="form-label">Headline</label>
                <input type="text" class="form-control" id="headline">
                <div class="invalid-feedback" id="headlineError">Headline is required.</div>
              </div>
              <div class="mb-3">
                <label for="bodyText" class="form-label">Body</label>
                <textarea class="form-control" id="bodyText" rows="2"></textarea>
              </div>
              <div class="mb-3">
                <label for="ctaText" class="form-label">CTA Text</label>
                <input type="text" class="form-control" id="ctaText">
                <div class="invalid-feedback" id="ctaTextError">CTA text is required.</div>
              </div>
              <div class="mb-3">
                <label for="imageUrl" class="form-label">Image URL</label>
                <input type="text" class="form-control" id="imageUrl">
                <div class="invalid-feedback" id="imageUrlError">Image URL must be a valid http(s) URL.</div>
              </div>
            </fieldset>
            <fieldset class="border p-2 mt-4">
              <legend>Configuration</legend>
              <div class="row g-3">
                <div class="col-6">
                  <label for="marginTop" class="form-label">Margin Top</label>
                  <div class="input-group">
                    <input type="number" class="form-control" id="marginTop" min="0" max="200">
                    <span class="input-group-text">px</span>
                  </div>
                </div>
                <div class="col-6">
                  <label for="marginBottom" class="form-label">Margin Bottom</label>
                  <div class="input-group">
                    <input type="number" class="form-control" id="marginBottom" min="0" max="200">
                    <span class="input-group-text">px</span>
                  </div>
                </div>
              </div>
            </fieldset>
            <button type="button" class="btn btn-small btn-outline-dark mt-4" id="resetBtn">Reset</button>
          </form>
        </div>
      </div>
    </div>

    <script src="../../../assets/dist/js/blocksdk.min.js"></script>
    <script src="../../../assets/dist/js/block-core.js"></script>

    <script>
      const defaults = {
        headline: "Track Peak Fall Color",
        bodyText: "Discover the best places to see fall colors with weekly updates on routes, parks, and hidden gems across the state.",
        ctaText: "Subscribe to the Fall Color Report",
        imageUrl: "https://image.hello.travelwisconsin.com/lib/fe261174736404757d1d71/m/1/a1505f57-09ba-4475-be8d-cb180b223e72.jpg",
        marginTop: "15",
        marginBottom: "15",
      };

      function buildEmailHtml(data) {
        const headline = window.BlockCore.escapeHtml(data.headline);
        const bodyText = window.BlockCore.escapeHtml(data.bodyText).replace(/\n/g, "<br/>");
        const ctaText = window.BlockCore.escapeHtml(data.ctaText);
        const imageUrl = window.BlockCore.escapeHtml(data.imageUrl);
        const marginTop = window.BlockCore.escapeHtml(data.marginTop);
        const marginBottom = window.BlockCore.escapeHtml(data.marginBottom);

        return `<!--[if mso | IE]><table align="center" border="0" cellpadding="0px" cellspacing="0" role="presentation" style="width:600px;" width="600" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]--> <div style="margin:0 auto;max-width:600px"> <table align="center" border="0" cellpadding="0px" cellspacing="0" role="presentation" style="width:100%"> <tbody> <tr> <td style="direction:ltr;font-size:0;padding:${marginTop}px 0 ${marginBottom}px 0;text-align:center"> 
<!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;" width="600" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]--> <div style="margin:0 auto;max-width:600px"> <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%"> <tbody> <tr> <td style="direction:ltr;font-size:0;padding:0 15px;text-align:center"> <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><![endif]-->
 %%[
          /* Define Onclick Subscribe URL */
          SET @OneClickFallColorReportSubscribeURL = CloudPagesURL(5247, "subscriberkey", @SubscriberKey, "emailaddr", @EmailAddress, "submitType", "oneclick", "oneclick_action", "Consumer_FallColorReportSubscribe")
          ]%% <!--[if mso | IE]><tr><td width="600px" ><table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:570px;" width="570" bgcolor="#FCD6B1" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]--> <div style="background:#fcd6b1;background-color:#fcd6b1;margin:0 auto;border-radius:16px 16px 0 0;max-width:570px"> <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" 
style="background:#fcd6b1;background-color:#fcd6b1;width:100%;border-radius:16px 16px 0 0"> <tbody> <tr> <td style="direction:ltr;font-size:0;padding:40px 30px 32px 30px;text-align:center"> <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:top;width:510px;" ><![endif]--> <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%"> <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top" width="100%"> <tbody> <tr> <td align="center" style="font-size:0;padding:0 0 16px 0;word-break:break-word"> <table border="0" cellpadding="0" cellspacing="0" role="presentation" 
style="border-collapse:collapse;border-spacing:0"> <tbody> <tr> <td style="width:72px"> <img alt="Fall Color Report" src="https://image.hello.travelwisconsin.com/lib/fe261174736404757d1d71/m/1/078cca04-12a5-43a1-bf95-149e4ae1ee32.png" style="border:0;display:block;outline:0;text-decoration:none;height:auto;width:100%;font-size:14px" width="72" height="auto"/> </td> </tr> </tbody> </table> </td> </tr> <tr> <td align="center" style="font-size:0;padding:0 10px 12px 10px;word-break:break-word"> <div style="font-family:'Source Sans Pro',sans-serif;font-size:20px;font-weight:700;line-height:1;text-align:center;color:#555"><span style="color:#002a3d;text-transform:uppercase">${headline}</span></div> </td> </tr> <tr> <td align="center" 
style="font-size:0;padding:0 10px 24px 10px;word-break:break-word"> <div style="font-family:'Source Sans Pro',sans-serif;font-size:14px;line-height:21px;text-align:center;color:#002a3d">${bodyText}</div> </td> </tr> <tr> <td align="center" style="font-size:0;padding:0;word-break:break-word"> <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:separate;line-height:100%"> <tbody> <tr> <td align="center" bgcolor="#002A3D" role="presentation" style="border:none;border-radius:30px;cursor:auto;mso-padding-alt:14px 28px;background:#002a3d" valign="middle"> <a href="%%=RedirectTo(@OneClickFallColorReportSubscribeURL)=%%"

<div style="margin:0 auto;border-radius:0 0 16px 16px;max-width:570px"> <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;border-radius:0 0 16px 16px"> <tbody> <tr> <td style="direction:ltr;font-size:0;padding:0;text-align:center"> <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:top;width:570px;" ><![endif]--> <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%"> <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#004d71;vertical-align:top" width="100%"> <tbody> <tr> <td align="center" 
style="font-size:0;padding:0;word-break:break-word"> <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:collapse;border-spacing:0" class="mj-full-width-mobile"> <tbody> <tr> <td style="width:570px" class="mj-full-width-mobile"> <img alt="" src="https://image.hello.travelwisconsin.com/lib/fe261174736404757d1d71/m/1/df6f6cdc-292b-44d3-9495-5117e6114b40.png" style="border:0;display:block;outline:0;text-decoration:none;height:auto;width:100%;font-size:14px" width="570" height="auto"/> </td> </tr> </tbody> </table> </td> </tr> </tbody> </table> </div> <!--[if mso | IE]></td></tr></table><![endif]--> </td> </tr> </tbody> </table> </div> <!--[if mso | IE]></td></tr></table></td></tr></table><![endif]--> </td> </tr> </tbody> </table> </div> 
<!--[if mso | IE]></td></tr></table><![endif]--> </td> </tr> </tbody> </table> </div><!--[if mso | IE]></td></tr></table><![endif]--><!-- End of Section -->`.trim();
      }

      function validate(data) {
        const errors = {};
        if (!String(data.headline || "").trim()) errors.headline = "Headline is required.";
        if (!String(data.ctaText || "").trim()) errors.ctaText = "CTA text is required.";
        if (!window.BlockCore.isValidHttpUrl(data.imageUrl)) errors.imageUrl = "Image URL must be a valid http(s) URL.";
        return errors;
      }

      window.BlockCore.initBlock({
        fieldIds: ["headline", "bodyText", "ctaText", "imageUrl", "marginTop", "marginBottom"],
        defaults,
        buildEmailHtml,
        validate,
        debounceMs: 250,
      });
    </script>
  </body>
</html>
